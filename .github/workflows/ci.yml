name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database-build-e2e:
    name: Database tests, production build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production build must not need a database or env vars.
      - run: npm run build
      # Local, throwaway Supabase stack (Docker is preinstalled on GitHub runners).
      # Applies supabase/migrations and supabase/seed.sql. No remote project or secrets.
      # Mailpit stays on: the password-reset E2E reads the reset email from it.
      - name: Start local Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Database and RLS tests (pgTAP)
        run: npm run db:test
      - name: Integration tests (parallel connections, e.g. booking concurrency)
        run: npm run test:integration
      - name: Check generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/types/database.ts
      - name: Write .env.local for the local stack
        run: npm run env:local
      # Rebuild so NEXT_PUBLIC_* values for the local stack are inlined.
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
